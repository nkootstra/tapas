[package]
name = "tapas"
version = "0.4.0"
edition = "2024"
rust-version = "1.97.1"
build = "build.rs"

[dependencies]
libc = "=0.2.189"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.z]
inherits = "release"
opt-level = "z"

[profile.s]
inherits = "release"
opt-level = "s"

[profile.3]
inherits = "release"
opt-level = 3
