name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Release intent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          # release-title-validator:start
          import os, re
          title = os.environ["PR_TITLE"]
          valid_intent = r"^(major|minor|patch|skip): [^\r\n]*\S[^\r\n]*$"
          reserved = r"^(major|minor|patch|skip):"
          if not title.strip() or "\n" in title or "\r" in title:
              raise SystemExit("pull request titles must be nonblank and single-line")
          if re.match(reserved, title, re.IGNORECASE) and not re.fullmatch(
              valid_intent, title
          ):
              raise SystemExit("reserved release-intent prefix is malformed")
          # release-title-validator:end
          PY
