name: Publish PR Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

env:
  REPOSITORY: ${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Download the verified target artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p work
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh run download "$RUN_ID" \
              --repo "$REPOSITORY" \
              --name "tapas-${target}" \
              --dir "work/${target}"
          done
          python3 - "$SOURCE_SHA" "$GITHUB_ENV" work/*/BUILD-METADATA.json <<'PY'
          # pr-build-metadata-validator:start
          import json
          import pathlib
          import re
          import sys

          source_sha, github_env, *metadata_paths = sys.argv[1:]
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None or not metadata_paths:
              raise SystemExit("invalid PR build metadata inputs")

          builds = set()
          for metadata_path in metadata_paths:
              metadata = json.loads(pathlib.Path(metadata_path).read_text(encoding="utf-8"))
              version = metadata.get("version")
              version_label = metadata.get("version_label")
              if (
                  metadata.get("source_sha") != source_sha
                  or not isinstance(version, str)
                  or re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) is None
                  or version_label != f"{version}-dev.{source_sha[:8]}"
              ):
                  raise SystemExit(f"invalid PR build metadata: {metadata_path}")
              builds.add((version, version_label))

          if len(builds) != 1:
              raise SystemExit("PR build targets disagree on version metadata")
          _, version_label = builds.pop()
          with pathlib.Path(github_env).open("a", encoding="utf-8") as output:
              output.write(f"TAPAS_BUILD_LABEL={version_label}\n")
          # pr-build-metadata-validator:end
          PY

      - name: Create public PR archives
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pr-${PR_NUMBER}-${SOURCE_SHA}"
          default_branch="$(gh repo view "$REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          mkdir -p release
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="release/tapas-${target}.tar.gz"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C "work/${target}" -czf "$archive" tapas BUILD-METADATA.json SHA256SUMS
          done
          (cd release && sha256sum tapas-*.tar.gz > SHA256SUMS)
          printf '%s\n' "PR #${PR_NUMBER} build for ${SOURCE_SHA}" > release-notes.md
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$tag" \
            --repo "$REPOSITORY" \
            --target "$default_branch" \
            --title "PR #${PR_NUMBER} (${SOURCE_SHA})" \
            --notes-file release-notes.md \
            --prerelease \
            release/*.tar.gz release/SHA256SUMS

      - name: Create or update the PR install comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:8}"
          main_sha="$(gh api "repos/${REPOSITORY}/commits/main" --jq '.sha')"
          installer_url="https://github.com/${REPOSITORY}/raw/refs/heads/main/install.sh"
          installer_pr_url="https://github.com/${REPOSITORY}/raw/refs/heads/main/install-pr.sh"
          windows_installer_url="https://github.com/${REPOSITORY}/raw/refs/heads/main/install.ps1"
          pinned_installer_url="https://github.com/${REPOSITORY}/raw/${main_sha}/install.sh"
          pinned_windows_installer_url="https://github.com/${REPOSITORY}/raw/${main_sha}/install.ps1"
          release_url="https://github.com/${REPOSITORY}/releases/tag/pr-${PR_NUMBER}-${SOURCE_SHA}"
          # The escaped backticks below are Markdown delimiters, not command substitution.
          # shellcheck disable=SC2006
          cat > comment.md <<EOF
          <!-- tapas-pr-build -->
          ### Tapas PR build ready

          Commit: \`${SOURCE_SHA}\`

          Install the matching macOS or Linux build:

          \`\`\`sh
          curl -fsSL ${installer_pr_url} | sh -s -- ${PR_NUMBER}
          \`\`\`

          The installed command is \`tapas-pr-${short_sha}\` and reports \`tapas ${TAPAS_BUILD_LABEL}\`.

          Clean local PR builds without affecting stable \`tapas\`:

          \`\`\`sh
          curl -fsSL ${installer_url} | sh -s -- --clean-dev-builds --dry-run
          curl -fsSL ${installer_url} | sh -s -- --clean-dev-builds
          \`\`\`

          If the branch URL is still cached and prints the old usage text, use the commit-pinned installer:

          \`\`\`sh
          curl -fsSL ${pinned_installer_url} | sh -s -- --clean-dev-builds
          \`\`\`

          On Windows PowerShell, clean local development builds with:

          \`\`\`powershell
          \$script = Invoke-RestMethod '${windows_installer_url}'
          & ([scriptblock]::Create(\$script)) -CleanDevBuilds -DryRun
          & ([scriptblock]::Create(\$script)) -CleanDevBuilds
          \`\`\`

          If the Windows script URL is cached, replace it with `${pinned_windows_installer_url}`.

          [View the prerelease and checksums](${release_url}).
          EOF
          comment_id="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- tapas-pr-build -->"))) | .id' | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$(cat comment.md)" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file comment.md >/dev/null
          fi
