name: Publish Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

env:
  REPOSITORY: ${{ github.repository }}

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    timeout-minutes: 15
    steps:
      - name: Check out the trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify the release tag signature
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git config --local gpg.ssh.allowedSignersFile ".github/release-signers"
          git verify-tag "$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"

      - name: Download the verified target artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          mkdir -p work
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh run download "$RUN_ID" \
              --repo "$REPOSITORY" \
              --name "tapas-${target}" \
              --dir "work/${target}"
            metadata="work/${target}/BUILD-METADATA.json"
            actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha"])' "$metadata")"
            test "$actual" = "$SOURCE_SHA"
            version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$metadata")"
            test "$version" = "${TAG#v}"
            actual_target="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"])' "$metadata")"
            test "$actual_target" = "$target"
          done

      - name: Create release archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tags must use vX.Y.Z" >&2
            exit 1
          }
          tag_sha="$(gh api "repos/${REPOSITORY}/commits/${TAG}" --jq .sha)"
          test "$tag_sha" = "$SOURCE_SHA"
          mkdir -p release
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="release/tapas-${target}.tar.gz"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C "work/${target}" -czf "$archive" tapas BUILD-METADATA.json SHA256SUMS
          done
          (cd release && sha256sum tapas-* > SHA256SUMS)

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            release/*.tar.gz release/SHA256SUMS
