name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify the release tag signature
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags --force origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/trusted-release-policy"
          git show \
            "refs/remotes/origin/trusted-release-policy:.github/release-signers" \
            > "$RUNNER_TEMP/release-signers"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git config --local gpg.ssh.allowedSignersFile \
            "$RUNNER_TEMP/release-signers"
          git verify-tag "$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"

      - name: Install formatting and linting components
        run: rustup component add rustfmt clippy

      - name: Install completion shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh

      - name: Install Node.js for process-filter examples
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Report runtime dependencies
        run: cargo tree --locked --edges normal

      - name: Audit the tapas command catalog
        run: python3 scripts/audit_catalog.py

      - name: Verify generated shell completions
        run: |
          cargo build --locked
          bash tests/completions.sh target/debug/tapas

      - name: Exercise process-filter examples
        env:
          TAPAS_REQUIRE_PLUGIN_EXAMPLES: 1
        run: cargo test --locked --test plugin_examples

      - name: Test release tooling
        run: |
          python3 -m unittest discover \
            --start-directory tests/scripts \
            --pattern 'test_*.py'

  regression-parity:
    name: Regression parity
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build Tapas
        run: cargo build --locked

      - name: Run regression parity cases
        run: python3 scripts/parity.py --binary target/debug/tapas --tool tapas

  harness-contracts:
    name: Harness contract (${{ matrix.harness }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        harness:
          - claude
          - codex
          - opencode
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/harness-e2e/package-lock.json

      - name: Install Bun for the OpenCode plugin contract
        if: matrix.harness == 'opencode'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build Tapas
        run: cargo build --locked

      - name: Install pinned harnesses and aimock
        working-directory: tests/harness-e2e
        run: npm ci

      - name: Exercise the generated OpenCode plugin directly
        if: matrix.harness == 'opencode'
        env:
          TAPAS_REQUIRE_BUN: 1
        run: cargo test --locked --test setup opencode_setup_is_idempotent_and_unsetup_removes_only_tapas

      - name: Run the real harness contract
        env:
          TAPAS_HARNESS: ${{ matrix.harness }}
          TAPAS_HARNESS_ARTIFACTS: ${{ runner.temp }}/tapas-harness-artifacts
        working-directory: tests/harness-e2e
        run: npm test

      - name: Upload harness diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tapas-${{ matrix.harness }}-harness-contract
          path: ${{ runner.temp }}/tapas-harness-artifacts/${{ matrix.harness }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

  test-and-package:
    name: ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            abi: darwin
            binary: tapas
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            abi: musl
            binary: tapas
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            abi: musl
            binary: tapas

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install the target
        run: |
          rustup target add "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install the musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Resolve and validate the package version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "release tags must use vX.Y.Z" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
            package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
            test "$package_version" = "$version"
          else
            version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          fi
          echo "TAPAS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set the build version label
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "TAPAS_BUILD_LABEL=${TAPAS_VERSION}-dev.${SOURCE_SHA:0:8}" >> "$GITHUB_ENV"
          else
            echo "TAPAS_BUILD_LABEL=${TAPAS_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: cargo test --locked

      - name: Build comparable release profiles
        run: |
          cargo build --locked --profile z --target "${TARGET}"
          cargo build --locked --profile s --target "${TARGET}"
          cargo build --locked --profile 3 --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}

      - name: Verify architecture and version natively
        run: |
          file "${BINARY}"
          "${BINARY}" --version | grep --fixed-strings "tapas ${TAPAS_BUILD_LABEL}"
        env:
          BINARY: target/${{ matrix.target }}/z/${{ matrix.binary }}

      - name: Package checksums and build metadata
        run: |
          python3 scripts/package_artifact.py \
            --binary "${BINARY}" \
            --output "${OUTPUT}" \
            --binary-name "${BINARY_NAME}" \
            --version "${TAPAS_VERSION}" \
            --version-label "${TAPAS_BUILD_LABEL}" \
            --source-sha "${SOURCE_SHA}" \
            --target "${TARGET}" \
            --abi "${ABI}" \
            --workflow-run "${GITHUB_RUN_ID}"
          python3 - "${OUTPUT}" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for line in (root / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"checksum mismatch: {name}")
          PY
        env:
          ABI: ${{ matrix.abi }}
          BINARY: target/${{ matrix.target }}/z/${{ matrix.binary }}
          BINARY_NAME: ${{ matrix.binary }}
          OUTPUT: dist/${{ matrix.target }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ matrix.target }}

      - name: Measure the packaged release artifact and evaluate its budget
        id: release_metrics
        continue-on-error: true
        run: |
          python3 scripts/release_metrics.py \
            --release-artifact "${RELEASE_ARTIFACT}" \
            --profile "z=${PROFILE_ROOT}/z/${BINARY_NAME}" \
            --profile "s=${PROFILE_ROOT}/s/${BINARY_NAME}" \
            --profile "3=${PROFILE_ROOT}/3/${BINARY_NAME}" \
            --release-profile z \
            --target "${TARGET}" \
            --policy tests/release-budgets.json \
            --output "${REPORT}"
        env:
          PROFILE_ROOT: target/${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
          RELEASE_ARTIFACT: dist/${{ matrix.target }}/${{ matrix.binary }}
          REPORT: release-metrics/${{ matrix.target }}.json
          TARGET: ${{ matrix.target }}

      - name: Upload the release measurement report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tapas-${{ matrix.target }}-measurements
          path: release-metrics/${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Enforce the release measurement gate
        if: steps.release_metrics.outcome == 'failure'
        run: exit 1

      - name: Upload the release-profile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tapas-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  gate:
    name: CI gate
    needs: [quality, regression-parity, harness-contracts, test-and-package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory CI job
        env:
          QUALITY: ${{ needs.quality.result }}
          REGRESSION_PARITY: ${{ needs.regression-parity.result }}
          HARNESS_CONTRACTS: ${{ needs.harness-contracts.result }}
          TEST_AND_PACKAGE: ${{ needs.test-and-package.result }}
        run: |
          set -euo pipefail
          test "$QUALITY" = success
          test "$REGRESSION_PARITY" = success
          test "$HARNESS_CONTRACTS" = success
          test "$TEST_AND_PACKAGE" = success
