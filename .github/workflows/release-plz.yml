name: Release automation

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: release-automation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Resolve release intent
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Check out the complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release-intent merge title
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          python3 scripts/release_policy.py validate-title "$subject"

      - name: Resolve the requested release version
        id: policy
        run: |
          set -euo pipefail
          current_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
          desired_version="$(git log --format=%s "${current_tag}..HEAD" |
            python3 scripts/release_policy.py next-version \
              --current "$current_tag" \
              --manifest Cargo.toml \
              --lockfile Cargo.lock)"
          echo "version=$desired_version" >> "$GITHUB_OUTPUT"

  release:
    name: Create the signed release tag
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      startsWith(github.event.pull_request.title, 'skip: prepare v')
    uses: ./.github/workflows/release-tag.yml
    with:
      release_pr_number: ${{ github.event.pull_request.number }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

  prepare:
    name: Prepare the release pull request
    needs: policy
    if: needs.policy.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Suspend existing release pull request auto-merge
        env:
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pulls_file="${RUNNER_TEMP}/existing-release-pulls.json"
          release_pr_file="${RUNNER_TEMP}/existing-release-pull.json"
          files_file="${RUNNER_TEMP}/existing-release-files.json"
          auto_merge_file="${RUNNER_TEMP}/existing-auto-merge.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            > "$pulls_file"
          python3 scripts/release_normalization.py inspect \
            --pulls-json "$pulls_file" \
            --repository "$GITHUB_REPOSITORY" \
            --app-login "$APP_LOGIN" \
            --output-json "$release_pr_file" \
            --allow-none
          number="$(jq -r '.number // empty' "$release_pr_file")"
          if [ -n "$number" ]; then
            [[ "$number" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/files?per_page=100" \
              > "$files_file"
            python3 scripts/release_normalization.py auto-merge \
              --pr-json "$release_pr_file" \
              --files-json "$files_file" \
              --repository "$GITHUB_REPOSITORY" \
              --app-login "$APP_LOGIN" \
              --output-json "$auto_merge_file"
            if [ "$(jq -r '.disable_existing' "$auto_merge_file")" = true ]; then
              gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto
            fi
          fi

      - name: Prepare the release pull request
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          command: release-pr
          # This pins the release-plz CLI, not the Tapas package version.
          version: "0.3.160"

      - name: Apply literal SemVer to the release PR
        env:
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          DESIRED_VERSION: ${{ needs.policy.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PLZ_PRS: ${{ steps.release-plz.outputs.prs }}
        run: |
          set -euo pipefail
          pulls_file="${RUNNER_TEMP}/release-pulls.json"
          release_plz_prs_file="${RUNNER_TEMP}/release-plz-prs.json"
          release_pr_file="${RUNNER_TEMP}/release-pull.json"
          printf '%s\n' "$RELEASE_PLZ_PRS" > "$release_plz_prs_file"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            > "$pulls_file"
          python3 scripts/release_normalization.py inspect \
            --pulls-json "$pulls_file" \
            --release-plz-prs-json "$release_plz_prs_file" \
            --expected-version "$DESIRED_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --app-login "$APP_LOGIN" \
            --output-json "$release_pr_file"
          branch="$(jq -r '.head.ref // empty' "$release_pr_file")"
          expected_head="$(jq -r '.head.sha // empty' "$release_pr_file")"
          number="$(jq -r '.number // empty' "$release_pr_file")"
          old_title="$(jq -r '.title // empty' "$release_pr_file")"

          [[ "$DESIRED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$branch" =~ ^release-plz-[A-Za-z0-9._/-]+$ ]]
          [[ "$expected_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$number" =~ ^[0-9]+$ ]]
          [[ "$old_title" =~ ^skip:\ prepare\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          old_title_version="${BASH_REMATCH[1]}"

          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          git switch --detach "refs/remotes/origin/${branch}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          created_version="$(python3 - <<'PY'
          import pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          print(manifest["package"]["version"])
          PY
          )"
          [[ "$created_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [ "$created_version" != "$DESIRED_VERSION" ]; then
            release-plz set-version "$DESIRED_VERSION"
            git diff --check
            mapfile -t changed_files < <(git diff --name-only)
            test "${#changed_files[@]}" -gt 0
            for path in "${changed_files[@]}"; do
              case "$path" in
                Cargo.toml|Cargo.lock|CHANGELOG.md) ;;
                *) echo "normalization changed unexpected file: $path" >&2; exit 1 ;;
              esac
            done

            mutation_file="${RUNNER_TEMP}/release-normalization-mutation.json"
            python3 scripts/release_normalization.py mutation \
              --repository "$GITHUB_REPOSITORY" \
              --branch "$branch" \
              --expected-head "$expected_head" \
              --version "$DESIRED_VERSION" \
              --output-json "$mutation_file" \
              "${changed_files[@]}"
            gh api graphql --input "$mutation_file" \
              --jq '.data.createCommitOnBranch.commit.oid'
          fi

          body_file="${RUNNER_TEMP}/release-pr-body.md"
          gh pr view "$number" --json body --jq .body > "$body_file"
          python3 scripts/release_normalization.py body \
            --body-file "$body_file" \
            --old-version "$old_title_version" \
            --new-version "$DESIRED_VERSION"
          gh pr edit "$number" \
            --title "skip: prepare v${DESIRED_VERSION}" \
            --body-file "$body_file"

      - name: Enable guarded release pull request auto-merge
        env:
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pulls_file="${RUNNER_TEMP}/final-release-pulls.json"
          release_pr_file="${RUNNER_TEMP}/final-release-pull.json"
          files_file="${RUNNER_TEMP}/final-release-files.json"
          auto_merge_file="${RUNNER_TEMP}/final-auto-merge.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            > "$pulls_file"
          python3 scripts/release_normalization.py inspect \
            --pulls-json "$pulls_file" \
            --repository "$GITHUB_REPOSITORY" \
            --app-login "$APP_LOGIN" \
            --output-json "$release_pr_file"
          number="$(jq -r '.number // empty' "$release_pr_file")"
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > "$release_pr_file"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/files?per_page=100" \
            > "$files_file"
          python3 scripts/release_normalization.py auto-merge \
            --pr-json "$release_pr_file" \
            --files-json "$files_file" \
            --repository "$GITHUB_REPOSITORY" \
            --app-login "$APP_LOGIN" \
            --output-json "$auto_merge_file"
          final_number="$(jq -r '.number' "$auto_merge_file")"
          final_head="$(jq -r '.head_sha' "$auto_merge_file")"
          final_title="$(jq -r '.title' "$auto_merge_file")"
          test "$final_number" = "$number"
          [[ "$final_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$final_title" =~ ^skip:\ prepare\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$(jq -r '.disable_existing' "$auto_merge_file")" = true ]; then
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
          gh pr merge "$number" \
            --repo "$GITHUB_REPOSITORY" \
            --auto --squash \
            --match-head-commit "$final_head" \
            --subject "$final_title"
